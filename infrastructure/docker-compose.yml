services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: mecorion
      POSTGRES_USER: mecorion
      POSTGRES_PASSWORD: mecorion
    ports:
      - "5432:5432"
    volumes:
      - mecorion_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mecorion -d mecorion"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mecorion_postgres:
